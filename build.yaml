# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs.
#
# ZMK Studio is not on by default. To enable it, add the `studio-rpc-usb-uart`
# snippet and CONFIG_ZMK_STUDIO=y. On a split, put both on the central side
# only -- the peripheral gets a plain entry.
#
# board:
#   - nice_nano_v2
# shield:
#   - corne_left
#   - corne_right
#
# include:
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#   - board: nice_nano_v2
#     shield: corne_right
include:
  - board: xiao_ble
    shield: pad_bt nice_oled
    snippet: studio-rpc-usb-uart
#    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: xiao_ble
    shield: pad_bt nice_oled
#    shield: settings_reset
